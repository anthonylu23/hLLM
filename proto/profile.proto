syntax = "proto3";

package hllm.v1;

import "common.proto";

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_CPU = 1;
  BACKEND_MLX = 2;
  BACKEND_CUDA = 3;
}

enum MemoryDomain {
  MEMORY_DOMAIN_UNSPECIFIED = 0;
  MEMORY_DOMAIN_UNIFIED = 1;
  MEMORY_DOMAIN_DEVICE = 2;
  MEMORY_DOMAIN_HOST = 3;
  MEMORY_DOMAIN_HOST_PINNED = 4;
}

enum ConnectionType {
  CONNECTION_TYPE_UNSPECIFIED = 0;
  CONNECTION_TYPE_DIRECT = 1;
  CONNECTION_TYPE_PEER_RELAYED = 2;
  CONNECTION_TYPE_DERP_RELAYED = 3;
  CONNECTION_TYPE_UNKNOWN = 4;
}

message MemoryBudget {
  MemoryDomain domain = 1;
  uint64 capacity_bytes = 2;
  uint64 runtime_reserve_bytes = 3;
  double safety_fraction = 4;
}

message WorkerProfile {
  ArtifactVersion schema_version = 1;
  string worker_id = 2;
  string endpoint = 3;
  Backend backend = 4;
  MemoryDomain primary_memory_domain = 5;
  repeated string supported_architectures = 6;
  repeated DataType supported_execution_dtypes = 7;
  repeated MemoryBudget memory_budgets = 8;
  uint64 fixed_workspace_bytes = 9;
  uint32 activation_buffer_count = 10;
  double allocator_allowance_fraction = 11;
  uint64 host_transport_buffer_bytes = 12;
  Provenance provenance = 13;
  optional uint64 observed_available_host_bytes = 14;
  string observed_at = 15;
}

message LinkProfile {
  ArtifactVersion schema_version = 1;
  string source_worker_id = 2;
  string target_worker_id = 3;
  ConnectionType connection_type = 4;
  double fixed_latency_ms = 5;
  double bandwidth_bytes_per_second = 6;
  double sender_conversion_ms = 7;
  double receiver_conversion_ms = 8;
  Provenance provenance = 9;
  string observed_at = 10;
  // QualifyLink sets this field. Legacy latency/bandwidth/conversion scalars
  // are unmeasured and MUST NOT be consumed as zero-valued measurements.
  optional LinkQualificationResult qualification = 11;
}

message WorkloadProfile {
  ArtifactVersion schema_version = 1;
  string workload_id = 2;
  uint64 prompt_tokens = 3;
  uint64 output_tokens = 4;
  uint32 concurrency = 5;
  uint64 total_cached_tokens = 6;
  double kv_overhead_factor = 7;
  DataType kv_dtype = 8;
  DataType activation_dtype = 9;
}


message LinkProbeIdentity {
  string worker_id = 1;
  string binary_digest = 2;
  string source_revision = 3;
  string compiler = 4;
  string grpc_version = 5;
  string protobuf_version = 6;
  string host = 7;
  string os = 8;
  string endpoint = 9;
}
message LinkTiming {
  uint32 cycle = 1;
  uint32 step = 2;
  uint64 payload_bytes = 3;
  uint64 message_bytes = 4;
  uint64 feedback_bytes = 5;
  double sender_encode_ms = 6;
  // Includes native gRPC serialization, receiver decode/validation and feedback.
  // Excludes sender encode (above), model compute and GPU boundary conversion.
  double round_trip_ms = 7;
}
message LinkStreamTiming {
  uint32 cycle = 1;
  double setup_ms = 2; // SequenceOpen through receiver initial metadata.
  double teardown_ms = 3;
}
message LinkQualificationResult {
  LinkProbeIdentity source = 1;
  LinkProbeIdentity target = 2;
  double channel_ready_ms = 3;
  repeated LinkStreamTiming streams = 4;
  repeated LinkTiming samples = 5;
  uint32 prompt_tokens = 6;
  uint32 hidden_size = 7;
  uint32 output_tokens = 8;
  uint32 warmup_cycles = 9;
  uint32 measured_cycles = 10;
}
