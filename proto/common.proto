syntax = "proto3";

package hllm.v1;

message Empty {}

message ArtifactVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_BOOL = 1;
  DATA_TYPE_U8 = 2;
  DATA_TYPE_I8 = 3;
  DATA_TYPE_I16 = 4;
  DATA_TYPE_U16 = 5;
  DATA_TYPE_I32 = 6;
  DATA_TYPE_U32 = 7;
  DATA_TYPE_I64 = 8;
  DATA_TYPE_U64 = 9;
  DATA_TYPE_F16 = 10;
  DATA_TYPE_BF16 = 11;
  DATA_TYPE_F32 = 12;
  DATA_TYPE_F64 = 13;
}

enum Provenance {
  PROVENANCE_UNSPECIFIED = 0;
  PROVENANCE_THEORETICAL = 1;
  PROVENANCE_CONFIGURED = 2;
  PROVENANCE_OBSERVED = 3;
  PROVENANCE_MEASURED = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_INCOMPATIBLE_WORKER = 2;
  ERROR_CODE_STALE_DEPLOYMENT = 3;
  ERROR_CODE_OUT_OF_ORDER = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_DEADLINE_EXCEEDED = 6;
  ERROR_CODE_WORKER_UNAVAILABLE = 7;
  ERROR_CODE_BACKEND_ERROR = 8;
  ERROR_CODE_TRANSPORT_ERROR = 9;
}

message RuntimeError {
  ErrorCode code = 1;
  string detail = 2;
  bool retryable = 3;
}
