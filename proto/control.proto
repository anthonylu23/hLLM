syntax = "proto3";

package hllm.v1;

import "common.proto";
import "model.proto";
import "placement.proto";
import "profile.proto";

message Capabilities { WorkerProfile worker = 1; }
message QualificationState {
  optional uint64 available_host_bytes = 1;
  optional uint64 available_device_bytes = 2;
  string backend_version = 3;
  string driver_version = 4;
  string allocator = 5;
  string binary_digest = 6;
  string device_identity = 7;
  uint64 process_id = 8;
  string boundary_transport_mode = 9;
  optional string pytorch_alloc_conf = 10;
  optional string pytorch_cuda_alloc_conf = 11;
  string device_fingerprint = 12;
}
// Only the isolated profiling service implements these diagnostic RPCs.
message LinkQualificationRequest {
  string target_worker_id = 1; // Resolved through the server's explicit peer allowlist.
  uint32 prompt_tokens = 2;
  uint32 hidden_size = 3;
  uint32 output_tokens = 4;
  uint32 warmup_cycles = 5;
  uint32 measured_cycles = 6;
  uint32 timeout_ms = 7;
}
message StageEndpoint {
  uint32 stage_index = 1;
  string worker_id = 2;
  string endpoint = 3;
}
message LoadStageRequest {
  DeploymentPlan plan = 1;
  uint32 stage_index = 2;
  ModelManifest manifest = 3;
  repeated StageEndpoint stage_endpoints = 4;
}
message LoadStageResponse {
  bool accepted = 1;
  string detail = 2;
  optional RuntimeError error = 3;
}
message UnloadStageRequest {
  string plan_id = 1;
  uint64 deployment_version = 2;
}
message ReserveRequestMessage {
  string plan_id = 1;
  string request_id = 2;
  uint64 deployment_version = 3;
  uint64 maximum_total_tokens = 4;
  uint64 deadline_unix_ms = 5;
}
message ReserveResponse {
  bool accepted = 1;
  string detail = 2;
  optional RuntimeError error = 3;
}
message CancelRequestMessage {
  string plan_id = 1;
  string request_id = 2;
  uint64 deployment_version = 3;
  string reason = 4;
}
message DomainMemoryUsage {
  MemoryDomain domain = 1;
  uint64 loaded_weight_bytes = 2;
  uint64 reserved_cache_bytes = 3;
  uint64 reserved_workspace_bytes = 4;
}
message RequestDomainMemory {
  MemoryDomain domain = 1;
  uint64 cache_bytes = 2;
  uint64 workspace_bytes = 3;
}
// One live reservation. Bytes are the logical cache/workspace reserved for this
// request alone; resident weights are counted once per worker, never per request.
message RequestReservationObservation {
  string request_id = 1;
  uint64 maximum_total_tokens = 2;
  repeated RequestDomainMemory memory = 3;
  uint64 admitted_at_monotonic_ns = 4;
  bool allocating = 5;
  bool running = 6;
  bool cancelled = 7;
}
// Admission/retirement of one request on this worker's steady clock.
message RequestLifecycleEvent {
  enum Kind {
    REQUEST_LIFECYCLE_KIND_UNSPECIFIED = 0;
    REQUEST_LIFECYCLE_KIND_ADMITTED = 1;
    REQUEST_LIFECYCLE_KIND_RETIRED = 2;
  }
  Kind kind = 1;
  string request_id = 2;
  uint64 sequence = 3;  // Per-process event counter; gaps reveal evicted history.
  uint64 at_monotonic_ns = 4;
  // Other reservations whose allocation had completed at this instant, so overlap
  // of allocated KV is recorded by the worker itself rather than inferred from
  // poll timing. Requests still allocating are omitted.
  repeated string concurrent_request_ids = 5;
  // Retirement only: completed, cancelled or expired.
  string reason = 6;
}
// Opt-in (`--request-observations`) request-lifecycle evidence for concurrency
// qualification. Steady-clock times order events within this process only.
message RequestObservations {
  uint64 process_id = 1;
  uint64 observed_at_monotonic_ns = 2;
  uint64 observed_at_unix_ns = 3;
  repeated RequestReservationObservation requests = 4;
  // Bounded history, newest last; `events_total` minus the count says how many
  // older events were evicted.
  repeated RequestLifecycleEvent events = 5;
  uint64 events_total = 6;
  uint64 peak_concurrent_requests = 7;  // Process-lifetime; never reset.
}
message MemoryReport {
  repeated MemoryBudget budgets = 1;
  uint64 loaded_weight_bytes = 2;
  uint64 reserved_cache_bytes = 3;
  uint64 reserved_workspace_bytes = 4;
  uint64 active_requests = 5;
  repeated DomainMemoryUsage domain_usage = 6;
  repeated string active_request_ids = 7;
  // Absent unless the worker was started with --request-observations.
  optional RequestObservations request_observations = 8;
}
// Process-wide framework allocations; separate from model reservation accounting.
message AllocatorMetrics {
  MemoryDomain domain = 1;
  uint64 active_bytes = 2;
  uint64 cached_bytes = 3;
  uint64 peak_bytes = 4;
}
// OS counters sampled immediately after allocator metrics; reads are not atomic.
// Optional counters distinguish unavailable from a measured zero. Peaks are never reset.
message ProcessMemoryObservation {
  uint64 process_id = 1;
  uint64 observed_at_unix_ns = 2;
  optional uint64 rss_bytes = 3;
  optional uint64 rss_lifetime_peak_bytes = 4;
  // macOS process physical footprint, including OS-accounted compressed memory.
  // This is not additive with RSS or MLX allocator bytes. Unavailable on Linux.
  optional uint64 physical_footprint_bytes = 5;
  optional uint64 physical_footprint_lifetime_peak_bytes = 6;
}
message WorkerMetrics {
  string worker_id = 1;
  optional AllocatorMetrics allocator = 2;
  uint64 queued_prefills = 3;
  uint64 queued_decodes = 4;
  uint64 executing_microbatches = 5;
  uint64 completed_steps = 6;
  double queue_wait_ms = 7;
  uint64 decode_batches = 8;
  uint64 largest_decode_batch = 9;
  optional ProcessMemoryObservation process_memory = 10;
}
message HealthResponse { bool serving = 1; string detail = 2; }

service WorkerControl {
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc GetQualificationState(Empty) returns (QualificationState);
  rpc GetLinkProbeInfo(Empty) returns (LinkProbeIdentity);
  rpc QualifyLink(LinkQualificationRequest) returns (LinkProfile);
  rpc LoadStage(LoadStageRequest) returns (LoadStageResponse);
  rpc UnloadStage(UnloadStageRequest) returns (Empty);
  rpc ReserveRequest(ReserveRequestMessage) returns (ReserveResponse);
  rpc CancelRequest(CancelRequestMessage) returns (Empty);
  rpc GetMemoryReport(Empty) returns (MemoryReport);
  rpc GetMetrics(Empty) returns (WorkerMetrics);
  rpc Health(Empty) returns (HealthResponse);
}
