syntax = "proto3";

package hllm.v1;

import "common.proto";

enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_PHASE_PREFILL = 1;
  EXECUTION_PHASE_DECODE = 2;
}

enum TerminalState {
  TERMINAL_STATE_UNSPECIFIED = 0;
  TERMINAL_STATE_COMPLETED = 1;
  TERMINAL_STATE_CANCELLED = 2;
  TERMINAL_STATE_DEADLINE_EXCEEDED = 3;
  TERMINAL_STATE_FAILED = 4;
}

message SequenceOpen {
  uint32 protocol_version = 1;
  string deployment_id = 2;
  uint64 deployment_version = 3;
  string request_id = 4;
  uint64 microbatch_id = 5;
  uint64 maximum_total_tokens = 6;
  uint64 maximum_new_tokens = 7;
  repeated uint64 stop_token_ids = 8;
  uint64 deadline_unix_ms = 9;
}

message TensorEnvelope {
  uint32 protocol_version = 1;
  string deployment_id = 2;
  string request_id = 3;
  uint64 microbatch_id = 4;
  uint64 sequence_number = 5;
  ExecutionPhase phase = 6;
  uint64 first_position = 7;
  repeated uint64 sequence_lengths = 8;
  repeated uint64 cache_slot_ids = 9;
  repeated uint64 shape = 10;
  DataType dtype = 11;
  string layout = 12;
  uint64 payload_length = 13;
  bytes checksum = 14;
  bytes payload = 15;
  uint64 deployment_version = 16;
}

message SampledToken {
  string deployment_id = 1;
  uint64 deployment_version = 2;
  string request_id = 3;
  uint64 microbatch_id = 4;
  uint64 sequence_number = 5;
  uint64 token_position = 6;
  uint64 token_id = 7;
}

message SequenceTermination {
  string deployment_id = 1;
  uint64 deployment_version = 2;
  string request_id = 3;
  uint64 microbatch_id = 4;
  TerminalState state = 5;
  optional RuntimeError error = 6;
  uint64 prompt_tokens = 7;
  uint64 generated_tokens = 8;
}

message StageError {
  string deployment_id = 1;
  uint64 deployment_version = 2;
  string request_id = 3;
  uint64 microbatch_id = 4;
  uint64 sequence_number = 5;
  RuntimeError error = 6;
}

message StageMessage {
  oneof body {
    SequenceOpen open_sequence = 1;
    TensorEnvelope tensor = 2;
    SampledToken sampled_token = 3;
    SequenceTermination terminate = 4;
    StageError error = 5;
  }
}

message GenerationRequest {
  bool capture_timing = 8;
  string deployment_id = 1;
  string request_id = 2;
  repeated uint64 token_ids = 3;
  uint64 maximum_new_tokens = 4;
  uint64 deployment_version = 5;
  repeated uint64 stop_token_ids = 6;
  uint64 deadline_unix_ms = 7;
}

message PrefillComplete {
  uint64 prompt_tokens = 1;
}

message TokenEvent {
  optional double native_elapsed_ms = 3;
  optional double native_request_setup_ms = 4;
  uint64 token_id = 1;
  uint64 token_position = 2;
}

message UsageEvent {
  uint64 prompt_tokens = 1;
  uint64 generated_tokens = 2;
}

message TerminalEvent {
  TerminalState state = 1;
  optional RuntimeError error = 2;
}

message GenerationEvent {
  string request_id = 1;
  oneof body {
    PrefillComplete prefill_complete = 2;
    TokenEvent token = 3;
    UsageEvent usage = 4;
    TerminalEvent terminal = 5;
  }
}

service Generation {
  rpc Generate(GenerationRequest) returns (stream GenerationEvent);
}

service StageExecution {
  rpc Execute(stream StageMessage) returns (stream StageMessage);
}
