[project]
name = "hllm-runtime"
version = "0.1.0"
description = "Heterogeneous LLM inference runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.74,<2",
  "protobuf>=6.31,<7",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
hllm = "hllm_control.cli:app"

[dependency-groups]
dev = [
  "cmake>=3.31,<5",
  "grpcio-tools>=1.74,<2",
  "hypothesis>=6.138,<7",
  "ninja>=1.11,<2",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/hllm_control"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "python/hllm_control/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["python", "tests/python", "tests/integration"]
exclude = ["python/hllm_control/proto"]
strict = ["python"]
