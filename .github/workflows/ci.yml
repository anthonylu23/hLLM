name: Checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/generate_proto.py --check
      - run: uv run pytest
      - run: git diff --exit-code

  cpu:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      # Build Protobuf and gRPC together so their generated headers and ABI agree.
      # Restore and save explicitly so the dependency cache is written as soon as the
      # dependency build succeeds, not only when the whole job (including tests) passes.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: native-deps
        with:
          path: build/ci-deps/install
          key: native-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci/build_native_deps.sh') }}
      - if: steps.native-deps.outputs.cache-hit != 'true'
        run: bash scripts/ci/build_native_deps.sh
      - if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-deps/install
          key: ${{ steps.native-deps.outputs.cache-primary-key }}
      - run: uv run cmake --preset dev -DCMAKE_PREFIX_PATH="$PWD/build/ci-deps/install"
      - run: uv run cmake --build --preset dev --parallel 2
      - run: uv run ctest --preset dev

  # Pushes to codex/** only make sure the native dependency cache exists on that
  # branch, so stacked pull requests based on it restore gRPC instead of rebuilding
  # it cold (about 48 minutes). No tests run here.
  deps:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: native-deps
        with:
          path: build/ci-deps/install
          key: native-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci/build_native_deps.sh') }}
      - if: steps.native-deps.outputs.cache-hit != 'true'
        run: bash scripts/ci/build_native_deps.sh
      - if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-deps/install
          key: ${{ steps.native-deps.outputs.cache-primary-key }}

  # Sanitizer coverage uses the same pinned dependency prefix, so AddressSanitizer and
  # UndefinedBehaviorSanitizer instrument hLLM's own code only. Container-overflow
  # detection is off because the uninstrumented Protobuf parser and instrumented hLLM
  # code share RepeatedField storage inside message objects, which produces the
  # documented mixed-instrumentation false positive (seen at boundary_codec.cpp:43 on a
  # read inside a live message allocation). Leak detection is off because gRPC's
  # global state is not torn down in the worker/test processes.
  asan:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: native-deps
        with:
          path: build/ci-deps/install
          key: native-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci/build_native_deps.sh') }}
      - if: steps.native-deps.outputs.cache-hit != 'true'
        run: bash scripts/ci/build_native_deps.sh
      - if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-deps/install
          key: ${{ steps.native-deps.outputs.cache-primary-key }}
      - run: uv run cmake --preset asan -DCMAKE_PREFIX_PATH="$PWD/build/ci-deps/install"
      - run: uv run cmake --build --preset asan --parallel 2
      - run: uv run ctest --preset asan
